[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anthrouter"
version = "0.1.0"
description = "Single-backend Anthropic proxy with model-tier routing and system-prompt sanitization"
requires-python = ">=3.10"
dependencies = ["truststore>=0.10.0"]

[project.optional-dependencies]
dev = ["ruff>=0.15.20"]

[project.scripts]
anthrouter = "anthrouter.__main__:main"

[tool.setuptools.packages.find]
include = [
    "anthrouter",
    "anthrouter.mapper*",
]

# The installer only ever pip-installs, so the built SPA ships in the wheel.
[tool.setuptools.package-data]
anthrouter = ["ui/dist/**/*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pinned: ruff 0.16 widened its default rule set, which flagged the intentional
# fail-closed `except Exception` guards across the routing path.  `I` adds
# import sorting on top of ruff's pre-0.16 default (E4, E7, E9, F).
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
